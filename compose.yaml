services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: 
      - "127.0.0.1:5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data:
    
